ont-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">grid.py</text><text x="113.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Células e</text><text x="113.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">custos</text><polyline points="113,528 113,556" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="177" y="556" width="106" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="230.0" y="596.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">maze.py</text><text x="230.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Geração com</text><text x="230.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">semente</text><polyline points="230,528 230,556" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="294" y="556" width="106" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="347.0" y="596.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">run_state.py</text><text x="347.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Aplica os</text><text x="347.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">eventos</text><polyline points="347,528 347,556" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><rect x="470" y="410" width="230" height="275" rx="8" fill="#ffffff" stroke="#6a4fa3" stroke-width="1.5"/><text x="485" y="436" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#4b3480">algorithms/</text><text x="485" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#4b3480">geradores de eventos</text><rect x="485" y="468" width="200" height="46" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="585.0" y="486.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">backtracking.py</text><text x="585.0" y="505.5" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#333333">busca em profundidade</text><rect x="485" y="520" width="200" height="46" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="585.0" y="538.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">dijkstra.py</text><text x="585.0" y="557.5" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#333333">caminho de menor custo</text><rect x="485" y="572" width="200" height="46" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="585.0" y="590.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">qlearning.py</text><text x="585.0" y="609.5" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#333333">aprendizado por reforço</text><rect x="485" y="624" width="200" height="46" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="585.0" y="642.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">base.py</text><text x="585.0" y="661.5" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#333333">tipos de evento</text><rect x="715" y="410" width="240" height="275" rx="8" fill="#ffffff" stroke="#6a4fa3" stroke-width="1.5"/><text x="730" y="436" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#4b3480">ui/</text><text x="760" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#4b3480">Pygame</text><rect x="730" y="468" width="210" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="835.0" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">board.py</text><text x="835.0" y="518.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Desenha o labirinto,</text><text x="835.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">as setas e o mapa de</text><text x="835.0" y="558.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">calor; edição com o mouse</text><rect x="730" y="592" width="210" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="835.0" y="615.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">theme.py</text><text x="835.0" y="635.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">cores do labirinto</text><polyline points="480,335 330,335 330,450" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><text x="340" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#1a1a1a">aplica os comandos</text><polyline points="750,335 845,335 845,468" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="900,468 900,184" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><text x="892" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end" fill="#1a1a1a">desenha</text><polyline points="400,474 485,474" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><text x="442" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">next()</text><polyline points="485,512 400,512" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/><text x="442" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">eventos</text><polyline points="835,685 835,703 230,703 230,685" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="532" y="720" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a">lê o estado da sessão e envia as edições feitas com o mouse</text><text x="30" y="764" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#444444">Fora do navegador — desenvolvimento e publicação</text><rect x="30" y="774" width="460" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="260.0" y="797.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">app/tests/</text><text x="260.0" y="817.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">testes automáticos (pytest) de algoritmos e sessão</text><rect x="510" y="774" width="460" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="740.0" y="797.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">tools/build_web.py</text><text x="740.0" y="817.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">monta a página e gera o pacote com o pygbag</text></svg>