<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="1000" height="840" fill="#ffffff"/><rect x="10" y="10" width="980" height="728" rx="12" fill="#ffffff" stroke="#777777" stroke-width="1.5" stroke-dasharray="7 5"/><text x="28" y="36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#444444">Navegador do usuário (sem instalação; o GitHub Pages só entrega os arquivos)</text><rect x="30" y="50" width="940" height="150" rx="10" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="45" y="78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1f4f86">Interface web — web/src/ (HTML, CSS e JavaScript)</text><rect x="45" y="92" width="216" height="92" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="153.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">template.html</text><text x="153.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Estrutura: controles,</text><text x="153.0" y="163.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">painéis e legenda</text><rect x="276" y="92" width="216" height="92" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="384.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">style.css</text><text x="384.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Aparência e layout</text><text x="384.0" y="163.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">responsivo</text><rect x="507" y="92" width="216" height="92" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="615.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">app.js</text><text x="615.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Eventos dos controles,</text><text x="615.0" y="163.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">métricas e gráfico</text><rect x="738" y="92" width="216" height="92" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="846.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">Canvas do labirinto</text><text x="846.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Área da página em que</text><text x="846.0" y="163.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">o Pygame desenha a grade</text><rect x="30" y="260" width="940" height="468" rx="10" fill="#f1edf9" stroke="#6a4fa3" stroke-width="1.5"/><text x="45" y="288" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#4b3480">Aplicação Python — app/</text><text x="45" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#4b3480">pygame-ce executado em WebAssembly pelo pygbag</text><rect x="480" y="290" width="270" height="78" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/><text x="615.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">main.py</text><text x="615.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#333333">Laço principal (60 quadros