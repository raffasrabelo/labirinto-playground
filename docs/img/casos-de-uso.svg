<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Arial, Helvetica, sans-serif">
  <title>Diagrama de casos de uso · Labirinto Playground</title>
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#344054" stroke-width="1.4"/>
    </marker>
    <marker id="open-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#98a2b3" stroke-width="1.4"/>
    </marker>
    <marker id="general" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#344054" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#ffffff"/>

  <!-- fronteira do sistema -->
  <rect x="230" y="20" width="650" height="560" rx="12" fill="#f8f9fb" stroke="#667085" stroke-width="1.5"/>
  <text x="555" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2939">Labirinto Playground</text>

  <!-- atores -->
  <g stroke="#1d2939" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="100" cy="215" r="14" fill="#ffffff"/>
    <line x1="100" y1="229" x2="100" y2="270"/>
    <line x1="74" y1="245" x2="126" y2="245"/>
    <line x1="100" y1="270" x2="80" y2="300"/>
    <line x1="100" y1="270" x2="120" y2="300"/>

    <circle cx="100" cy="425" r="14" fill="#ffffff"/>
    <line x1="100" y1="439" x2="100" y2="480"/>
    <line x1="74" y1="455" x2="126" y2="455"/>
    <line x1="100" y1="480" x2="80" y2="510"/>
    <line x1="100" y1="480" x2="120" y2="510"/>
  </g>
  <text x="100" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2939">Estudante</text>
  <text x="100" y="532" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2939">Professor</text>
  <text x="100" y="548" text-anchor="middle" font-size="11" fill="#667085">(uso em aula)</text>

  <!-- generalização: Professor herda os casos de uso do Estudante -->
  <line x1="100" y1="408" x2="100" y2="330" stroke="#344054" stroke-width="1.4" marker-end="url(#general)"/>

  <!-- associações do Estudante -->
  <g stroke="#344054" stroke-width="1.2">
    <line x1="128" y1="250" x2="320" y2="95"/>
    <line x1="128" y1="250" x2="320" y2="160"/>
    <line x1="128" y1="250" x2="320" y2="225"/>
    <line x1="128" y1="250" x2="320" y2="290"/>
    <line x1="128" y1="250" x2="320" y2="355"/>
    <line x1="128" y1="250" x2="320" y2="420"/>
  </g>
  <line x1="128" y1="250" x2="320" y2="500" stroke="#344054" stroke-width="1.2"/>

  <!-- casos de uso principais -->
  <g fill="#ffffff" stroke="#344054" stroke-width="1.5">
    <ellipse cx="430" cy="95" rx="110" ry="24"/>
    <ellipse cx="430" cy="160" rx="110" ry="24"/>
    <ellipse cx="430" cy="225" rx="110" ry="24"/>
    <ellipse cx="430" cy="290" rx="110" ry="24"/>
    <ellipse cx="430" cy="355" rx="110" ry="24"/>
    <ellipse cx="430" cy="420" rx="110" ry="24"/>
  </g>
  <ellipse cx="430" cy="500" rx="110" ry="28" fill="#ffffff" stroke="#344054" stroke-width="1.5"/>

  <g font-size="13" fill="#1d2939" text-anchor="middle">
    <text x="430" y="99">UC01 Escolher algoritmo</text>
    <text x="430" y="164">UC02 Configurar labirinto</text>
    <text x="430" y="229">UC03 Editar labirinto</text>
    <text x="430" y="294">UC04 Controlar execução</text>
    <text x="430" y="352">UC05 Acompanhar métricas</text>
    <text x="430" y="367" font-size="11" fill="#667085">status, legenda e explicação</text>
    <text x="430" y="424">UC06 Comparar algoritmos</text>
  </g>
  <text x="430" y="497" text-anchor="middle" font-size="13" fill="#1d2939">UC07 Treinar agente Q-Learning</text>
  <text x="430" y="512" text-anchor="middle" font-size="11" fill="#667085">α, γ, ε, episódios e recompensas</text>

  <!-- extensões -->
  <g fill="#ffffff" stroke="#344054" stroke-width="1.5">
    <ellipse cx="715" cy="160" rx="110" ry="24"/>
    <ellipse cx="715" cy="225" rx="110" ry="24"/>
    <ellipse cx="715" cy="290" rx="110" ry="24"/>
  </g>
  <ellipse cx="715" cy="500" rx="110" ry="28" fill="#ffffff" stroke="#344054" stroke-width="1.5"/>
  <g font-size="13" fill="#1d2939" text-anchor="middle">
    <text x="715" y="164">Sortear novo labirinto</text>
    <text x="715" y="229">Mover início e objetivo</text>
    <text x="715" y="294">Avançar passo a passo</text>
  </g>
  <text x="715" y="497" text-anchor="middle" font-size="13" fill="#1d2939">Ver política aprendida</text>
  <text x="715" y="512" text-anchor="middle" font-size="11" fill="#667085">mapa de calor e setas</text>

  <g stroke="#344054" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="604" y1="160" x2="542" y2="160" marker-end="url(#open)"/>
    <line x1="604" y1="225" x2="542" y2="225" marker-end="url(#open)"/>
    <line x1="604" y1="290" x2="542" y2="290" marker-end="url(#open)"/>
  </g>
  <line x1="604" y1="500" x2="542" y2="500" stroke="#344054" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <g font-size="11" fill="#475467" text-anchor="middle">
    <text x="573" y="153">«extend»</text>
    <text x="573" y="218">«extend»</text>
    <text x="573" y="283">«extend»</text>
  </g>
  <text x="573" y="493" font-size="11" fill="#475467" text-anchor="middle">«extend»</text>

  <!-- inclusão: comparar exige controlar a execução -->
  <path d="M538,413 C598,395 598,318 540,300" fill="none" stroke="#344054" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <text x="604" y="360" font-size="11" fill="#475467">«include»</text>

</svg>
